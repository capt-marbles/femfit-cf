name = "femfit-reminders"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Same namespace the Pages app writes to, bound by id.
[[kv_namespaces]]
binding = "FEMFIT_KV"
id = "bb7340ce6cda4320bcce09772d67b8ee"

# Hourly on the hour; each subscription fires only when its own local hour matches.
[triggers]
crons = ["0 * * * *"]
