<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#ec4899"/>
  <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- dumbbell bar -->
    <line x1="30" y1="50" x2="70" y2="50" stroke-width="6"/>
    <!-- left weight plates -->
    <rect x="16" y="38" width="14" height="24" rx="4" stroke-width="5" fill="white"/>
    <!-- right weight plates -->
    <rect x="70" y="38" width="14" height="24" rx="4" stroke-width="5" fill="white"/>
    <!-- left collar -->
    <line x1="30" y1="43" x2="30" y2="57" stroke-width="7"/>
    <!-- right collar -->
    <line x1="70" y1="43" x2="70" y2="57" stroke-width="7"/>
  </g>
</svg>
